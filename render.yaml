# Render Blueprint — описывает, как задеплоить backend, чтобы не настраивать
# поля вручную в панели Render. См. backend/README.md для локального запуска
# тех же команд.
#
# Секреты (DATABASE_URL, BOT_TOKEN и т.п.) сюда намеренно не вписаны —
# репозиторий публичный. Их нужно один раз вставить в панели Render после
# создания сервиса (Environment → добавить переменные, значения — из вашего
# локального backend/.env).
services:
  - type: web
    name: chtivo-shop-backend
    runtime: python
    plan: free
    region: frankfurt  # ближе к Supabase (eu-west-1, Ирландия), чем регионы США
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_NOTIFY_URL
        sync: false
      - key: BOT_NOTIFY_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
